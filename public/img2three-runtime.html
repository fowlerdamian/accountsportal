<!doctype html>
<!--
  img2threejs sandbox runtime for Marketing → 3D Model Builder.
  Loaded as <iframe sandbox="allow-scripts"> (opaque origin, no portal cookies/storage), so the
  Claude-generated factory code never runs with the staff session. All I/O is postMessage.
  Messages in:  load{code} · capture{views,size} · export{} · explode{amount} · autorotate{on} · reset{}
  Messages out: ready · loaded{parts,triangles} · error{message} · captured{id,images} · exported{id,buffer} · pick{name}
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #16171a; overflow: hidden; font: 12px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #tip { position: absolute; left: 10px; bottom: 10px; color: #cfcfcf; background: #000a; padding: 4px 8px; border-radius: 6px; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="tip"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { mergeVertices, mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const post = (msg, transfer) => parent.postMessage(msg, "*", transfer);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1f23);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.2;

// studio three-point rig
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.1, far: 20 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.8); fill.position.set(-4, 2, 2);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(-1, 3, -5);
scene.add(key, fill, rim, new THREE.HemisphereLight(0xffffff, 0x333333, 0.35));

const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

// helpers exposed to generated code
function rng(seed = 1) {
  let a = (seed >>> 0) || 1;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function canvasTexture(w, h, draw, opts = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  t.colorSpace = opts.colorSpace === "linear" ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const helpers = { rng, canvasTexture, RoundedBoxGeometry: (...a) => new RoundedBoxGeometry(...a), mergeVertices, mergeGeometries };

let model = null;
let homes = [];   // [{obj, pos, dir}] for explode
let size = 2;

function dispose(obj) {
  obj.traverse((o) => {
    o.geometry?.dispose?.();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of mats) { for (const v of Object.values(m)) if (v?.isTexture) v.dispose(); m.dispose(); }
  });
}

function frame() {
  const box = new THREE.Box3().setFromObject(model);
  const s = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  size = Math.max(s.x, s.y, s.z) || 1;
  const dist = size / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.35;
  controls.target.copy(c);
  camera.near = size / 100; camera.far = size * 50; camera.updateProjectionMatrix();
  setView(0, 12, dist);
  ground.position.y = box.min.y - 0.001;
  ground.scale.setScalar(size);
  key.shadow.camera.left = key.shadow.camera.bottom = -size * 1.5;
  key.shadow.camera.right = key.shadow.camera.top = size * 1.5;
  key.shadow.camera.far = size * 20; key.position.set(size * 1.5, size * 2.5, size * 2);
  key.shadow.camera.updateProjectionMatrix();
}

let viewDist = 5;
function setView(yawDeg, pitchDeg, dist = viewDist) {
  viewDist = dist;
  const y = THREE.MathUtils.degToRad(yawDeg), p = THREE.MathUtils.degToRad(pitchDeg);
  camera.position.set(
    controls.target.x + dist * Math.cos(p) * Math.sin(y),
    controls.target.y + dist * Math.sin(p),
    controls.target.z + dist * Math.cos(p) * Math.cos(y),
  );
  camera.lookAt(controls.target);
  controls.update();
}

function load(code) {
  let root;
  try {
    root = new Function("THREE", "helpers", code)(THREE, helpers);
    if (!root || !root.isObject3D) throw new Error("factory did not return a THREE.Object3D (missing `return root;`?)");
  } catch (e) {
    post({ type: "error", message: `${e?.name ?? "Error"}: ${e?.message ?? e}`, stack: String(e?.stack ?? "").split("\n").slice(0, 4).join("\n") });
    return;
  }
  if (model) { scene.remove(model); dispose(model); }
  model = root;
  let triangles = 0; const parts = [];
  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = o.receiveShadow = true;
      const n = o.geometry.index ? o.geometry.index.count / 3 : (o.geometry.attributes.position?.count ?? 0) / 3;
      triangles += n * (o.isInstancedMesh ? o.count : 1);
      parts.push(o.name || o.userData.part || "(unnamed)");
    }
  });
  scene.add(model);
  // explode directions = top-level children away from the model centre
  const centre = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
  let level = model; while (level.children.length === 1 && level.children[0].children.length) level = level.children[0];
  homes = level.children.map((obj) => {
    const c = new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3());
    const dir = c.sub(centre); if (dir.lengthSq() < 1e-8) dir.set(0, 1, 0);
    return { obj, pos: obj.position.clone(), dir: dir.normalize() };
  });
  frame();
  post({ type: "loaded", parts, triangles: Math.round(triangles) });
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// picking
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2(); let hl = null;
const tip = document.getElementById("tip");
renderer.domElement.addEventListener("pointerdown", (e) => { renderer.domElement._down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  const d = renderer.domElement._down; if (!model || !d || Math.hypot(e.clientX - d[0], e.clientY - d[1]) > 4) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(model, true)[0];
  if (hl) { hl.m.emissive?.copy(hl.e); hl = null; }
  if (!hit) { tip.style.display = "none"; return; }
  const m = Array.isArray(hit.object.material) ? hit.object.material[0] : hit.object.material;
  if (m?.emissive) { hl = { m, e: m.emissive.clone() }; m.emissive.set(0x553300); }
  const name = hit.object.name || hit.object.userData.part || "(unnamed)";
  tip.textContent = name; tip.style.display = "block";
  post({ type: "pick", name });
});

const CAPTURE_BG = new THREE.Color(0xd9dadd);
function captureViews(views, px) {
  const prev = { pos: camera.position.clone(), rot: controls.autoRotate, w: innerWidth, h: innerHeight, bg: scene.background };
  controls.autoRotate = false;
  scene.background = CAPTURE_BG; // light studio backdrop: dark parts stay legible to the vision review
  renderer.setSize(px, px, false); camera.aspect = 1; camera.updateProjectionMatrix();
  const images = views.map(({ yaw = 0, pitch = 12 }) => {
    setView(yaw, pitch); renderer.render(scene, camera);
    return renderer.domElement.toDataURL("image/jpeg", 0.85);
  });
  scene.background = prev.bg;
  camera.position.copy(prev.pos); controls.autoRotate = prev.rot; controls.update(); resize();
  return images;
}

addEventListener("message", async (e) => {
  const m = e.data || {};
  try {
    if (m.type === "load") load(String(m.code ?? ""));
    else if (m.type === "capture") {
      if (!model) return post({ type: "captured", id: m.id, images: [] });
      post({ type: "captured", id: m.id, images: captureViews(m.views ?? [{ yaw: 0 }], m.size ?? 768) });
    } else if (m.type === "export") {
      if (!model) return post({ type: "exported", id: m.id, error: "no model" });
      homes.forEach((h) => h.obj.position.copy(h.pos));
      const buffer = await new GLTFExporter().parseAsync(model, { binary: true });
      post({ type: "exported", id: m.id, buffer }, [buffer]);
    } else if (m.type === "explode") {
      const k = Number(m.amount) || 0;
      homes.forEach((h) => h.obj.position.copy(h.pos).addScaledVector(h.dir, k * size * 0.6));
    } else if (m.type === "autorotate") controls.autoRotate = !!m.on;
    else if (m.type === "reset") { if (model) frame(); }
    else if (m.type === "background") scene.background = new THREE.Color(m.color);
  } catch (err) {
    post({ type: "error", message: String(err?.message ?? err), id: m.id });
  }
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
post({ type: "ready" });
</script>
</body>
</html>
